<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공모주 청약 달력</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Pretendard Variable: DESIGN.md hangul substitute for Toss Product Sans -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1 class="title">공모주 청약 달력</h1>
      <p class="sub">청약 전에 위험 신호를 먼저 확인하세요.</p>
    </header>

    <section class="cal" aria-label="월별 청약 일정">
      <div class="cal-nav">
        <button class="btn-small" id="prev" type="button" aria-label="이전 달">◀</button>
        <h2 class="month" id="month" aria-live="polite"></h2>
        <button class="btn-small" id="next" type="button" aria-label="다음 달">▶</button>
      </div>
      <div class="dow" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      <div id="weeks"></div>
    </section>

    <section class="list" id="list" aria-label="이번 달 청약 목록"></section>
    <section class="detail" id="detail" aria-live="polite"></section>

    <footer class="foot">
      <p id="updated"></p>
      <p id="disclaimer"></p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
