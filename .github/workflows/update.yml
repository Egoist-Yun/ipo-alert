name: update

on:
  schedule:
    # Off the hour: GitHub delays top-of-hour schedules the most (an 08:00 run started at 12:58).
    - cron: "17 23 * * *"  # 08:17 KST
    - cron: "47 8 * * *"   # 17:47 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"

concurrency:
  group: ipo-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Update data
        id: run
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m ipo.main

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F-%H%M)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done

      - name: Build site
        if: ${{ !cancelled() }}
        run: |
          mkdir _site
          cp web/index.html web/style.css web/app.js web/calendar.js web/brokers.js web/manifest.json web/icon.svg _site/
          if [ -f data/ipos.json ]; then cp data/ipos.json _site/ipos.json; fi

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      - name: Fail the run if the update step failed
        if: steps.run.outcome == 'failure'
        run: exit 1

      - name: Notify phone when the workflow itself failed
        if: ${{ failure() && steps.run.outcome != 'failure' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          MSG="GitHub Actions update가 실패했어요. 데이터가 갱신되지 않았을 수 있어요."
          # FCM (with ntfy as its fallback) through the project's own sender; plain ntfy if python or the dependencies are not there
          python -m ipo.push "공모주 수집 실패" "$MSG" || {
            if [ -n "$NTFY_TOPIC" ]; then
              curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"공모주 수집 실패\",\"message\":\"$MSG\"}" https://ntfy.sh
            fi
          }
